[project]
name = "fuj_coherent_receiver_gui"
version = "0.1.0"
description = "Coherent receiver GUI (containerized)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "dash>=2.18.0",
    "dash-bootstrap-components>=1.6.0",
    "pyserial>=3.5",
    "slowapi>=0.1.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
fuj-gui = "fuj_gui.app:main"
