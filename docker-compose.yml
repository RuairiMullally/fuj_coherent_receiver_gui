version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fuj_unified
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - HARDWARE_MODE=simulator
    devices:
      - /dev/arduino:/dev/arduino
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/api/health'); exit(0 if r.status_code == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
